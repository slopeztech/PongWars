# Looping background tracks: semitones from A4 per step, -99 marks a rest.
# The `menu` track plays on the menus; every other track is a candidate for matches.
[music.menu]
step_seconds = 0.26
wave = "triangle"
volume = 0.3
notes = [-12, -99, -8, -99, -5, -99, -8, -99, -10, -99, -7, -99, -3, -99, -7, -99,
         -12, -99, -8, -99, -5, -99, 0, -99, -3, -99, -5, -99, -8, -99, -99, -99]

[music.arcade]
