# Synthesized sound effects and the event -> sound mapping.
# wave: square | triangle | noise. Pitch slides from `from` to `to` (Hz).

[events]
Served = "serve"
PaddleHit = "paddle"
WallHit = "wall"
BumperHit = "bumper"
Goal = "goal"
PlayerEliminated = "eliminated"
MatchEnded = "win"
ObstacleDestroyed = "break"
PickupSpawned = "spawn"
PickupCollected = "pickup"
EffectApplied = "effect"
LaserFired = "laser"
WeaponEmpty = "empty"
ShieldUsed = "shield"
BombDetonated = "bomb"
SuddenDeath = "alarm"
CatReleased = "meow"
CatPounced = "pounce"
BallWarped = "warp"

[sounds.meow]
wave = "triangle"
from = 500
to = 900
duration = 0.25
volume = 0.45

[sounds.pounce]
wave = "square"
from = 1000
to = 350
duration = 0.1
volume = 0.4

[sounds.warp]
wave = "triangle"
from = 1200
to = 200
duration = 0.2
volume = 0.4

[sounds.serve]
wave = "triangle"
from = 330
to = 440
duration = 0.12

[sounds.menu]
wave = "triangle"
from = 660
to = 660
duration = 0.03

