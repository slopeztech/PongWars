schema: spec-driven

context: |
  Language: en
  All artifacts, code, comments and documentation must be written in English.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  # Project: PongWars
  Classic Pong with an 8-bit look and pseudo-3D view, built with Python + pygame.
  Configurable matches (mode, arena, obstacles, extras), 2 players (same keyboard
  or LAN) and 1 vs AI with several difficulties. Extras during play: weapons,
  powers and penalties. The game is localizable: every user-visible string goes
  through the i18n layer (English is the source language).

  # Stack
  - Python >= 3.11, pygame-ce, src-layout (`src/pongwars`)
  - Tests: pytest (+ pytest-cov, hypothesis for simulation properties)
  - Quality: ruff (lint+format), mypy --strict on `domain`, `net`, `ai`, `core`
  - Code documentation: Doxygen (`docs/Doxyfile`), Doxygen-style comments on ALL
    public APIs (`@brief`, `@param`, `@return`)
  - Packaging: pyproject.toml (hatchling)

  # Architecture (summary; details in openspec/changes/*/design.md)
  One-way layer dependencies:
  `app -> ui/render/input/audio/net -> domain <- ai`, with `core` below all.
  - `domain`: pure, deterministic simulation. MUST NOT import pygame.
  - Fixed simulation step (60 Hz), independent from rendering.
  - Everything extensible (modes, arenas, extras, AI) is registered in a
    `Registry` and loaded from data/plugins; adding one MUST NOT touch the core.
  - Match configuration = immutable, serializable `MatchConfig` dataclass.

  # Conventions
  - Everything in English: code, identifiers, comments, docs, OpenSpec artifacts.
  - User-visible text lives in locale catalogs (`data/locales/<lang>.json`) and
    is accessed via translation keys; never hardcode UI strings.
  - Full static typing, no `Any` in public APIs.
  - Every spec requirement needs at least one test named
    `test_<capability>_<behaviour>`.
  - No magic numbers: constants in `pongwars.domain.constants` or in config.
  - 8-bit assets generated by code or free-licensed and listed in
    `assets/LICENSES.md`.

rules:
  proposal:
    - Always state what is out of scope (non-goals)
  design:
    - Respect the layer dependency rule described in the context
    - Document discarded alternatives and why
  specs:
    - Every requirement needs at least one WHEN/THEN scenario
    - Requirements must be verifiable by automated tests
  tasks:
    - Small tasks (max ~2 h), each with its associated test
    - Include Doxygen documentation for whatever is added

operations:
  apply:
    guidance:
      - Write the test together with the code; do not mark a task done without green tests
      - Run `ruff check`, `mypy` and `pytest` before marking a task complete
